<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定价策略与收益管理 - 交互工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .tabs-wrapper {
            display: flex;
            border-bottom: 2px solid #f0f0f0;
            background: #f9f9f9;
        }

        .tab-button {
            flex: 1;
            padding: 16px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 15px;
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: white;
        }

        .tab-button:hover {
            color: #667eea;
            background: white;
        }

        .tab-content {
            display: none;
            padding: 40px;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-group {
            margin-bottom: 25px;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Noto Sans TC', sans-serif;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        .result-box {
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%);
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .result-item {
            margin-bottom: 15px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(102, 126, 234, 0.2);
        }

        .result-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .result-label {
            font-weight: 600;
            color: #667eea;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .result-value {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .chart-container {
            margin: 30px 0;
            background: white;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            padding: 20px;
        }

        .chart-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .select-group {
            margin-bottom: 25px;
        }

        .select-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        .select-group select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Noto Sans TC', sans-serif;
            cursor: pointer;
            background-color: white;
        }

        .select-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .recommendation-box {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .recommendation-box h3 {
            margin-bottom: 10px;
            font-size: 15px;
        }

        .recommendation-box p {
            font-size: 13px;
            line-height: 1.6;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .strategy-card {
            background: white;
            border: 2px solid #f0f0f0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .strategy-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }

        .strategy-card.selected {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-color: #667eea;
        }

        .strategy-card h4 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .strategy-card p {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }

        .info-text {
            font-size: 13px;
            color: #666;
            margin-top: 8px;
            line-height: 1.5;
        }

        canvas {
            max-width: 100%;
            height: auto;
        }

        @media (max-width: 768px) {
            .input-row {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .tab-content {
                padding: 25px 15px;
            }

            .tabs-wrapper {
                flex-wrap: wrap;
            }

            .tab-button {
                flex: 0 1 50%;
                padding: 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>定价策略与收益管理</h1>
            <p>交互式计算与决策工具</p>
        </div>

        <div class="tabs-wrapper">
            <button class="tab-button active" onclick="switchTab(0)">Tab 1：价格弹性计算器</button>
            <button class="tab-button" onclick="switchTab(1)">Tab 2：定价策略选择器</button>
            <button class="tab-button" onclick="switchTab(2)">Tab 3：收益管理模拟器</button>
        </div>

        <!-- Tab 1: 价格弹性计算器 -->
        <div class="tab-content active">
            <h2 style="color: #667eea; margin-bottom: 20px;">Tab 1：价格弹性计算器</h2>

            <p class="info-text">计算需求价格弹性（PED），帮助您判断价格变化对销量的影响。</p>

            <div class="input-row">
                <div class="input-group">
                    <label>原价格（元）</label>
                    <input type="number" id="priceOriginal" value="100" step="0.1">
                </div>
                <div class="input-group">
                    <label>新价格（元）</label>
                    <input type="number" id="priceNew" value="110" step="0.1">
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label>原销量（单位）</label>
                    <input type="number" id="quantityOriginal" value="1000" step="1">
                </div>
                <div class="input-group">
                    <label>新销量（单位）</label>
                    <input type="number" id="quantityNew" value="950" step="1">
                </div>
            </div>

            <button class="button" onclick="calculateElasticity()">计算弹性</button>

            <div id="elasticityResult" class="result-box" style="display: none; margin-top: 30px;">
                <div class="result-item">
                    <div class="result-label">需求价格弹性（PED）</div>
                    <div class="result-value" id="pedValue">--</div>
                </div>
                <div class="result-item">
                    <div class="result-label">弹性解释</div>
                    <div style="color: #666; font-size: 13px; margin-top: 8px;" id="pedExplain">--</div>
                </div>
                <div class="result-item">
                    <div class="result-label">原收益</div>
                    <div style="color: #333; font-weight: 600;" id="revenueOriginal">--</div>
                </div>
                <div class="result-item">
                    <div class="result-label">新收益</div>
                    <div style="color: #333; font-weight: 600;" id="revenueNew">--</div>
                </div>
                <div class="result-item">
                    <div class="result-label">收益变化</div>
                    <div style="color: #333; font-weight: 600;" id="revenueChange">--</div>
                </div>
                <div class="recommendation-box">
                    <h3>建议</h3>
                    <p id="recommendation">--</p>
                </div>
            </div>
        </div>

        <!-- Tab 2: 定价策略选择器 -->
        <div class="tab-content">
            <h2 style="color: #667eea; margin-bottom: 20px;">Tab 2：定价策略选择器</h2>

            <p class="info-text">根据您的产品特性，我们推荐最适合的定价策略。</p>

            <div class="select-group">
                <label>产品类型</label>
                <select id="productType" onchange="updateStrategyOptions()">
                    <option value="">请选择...</option>
                    <option value="software">软件/应用</option>
                    <option value="luxury">奢侈品</option>
                    <option value="commodity">日用商品</option>
                    <option value="service">服务（航空/饭店）</option>
                    <option value="subscription">订阅制</option>
                </select>
            </div>

            <div class="select-group">
                <label>市场竞争程度</label>
                <select id="competition">
                    <option value="">请选择...</option>
                    <option value="high">非常激烈（多个竞争对手）</option>
                    <option value="medium">中等（3-5个主要竞争对手）</option>
                    <option value="low">有限（领先品牌少）</option>
                </select>
            </div>

            <div class="select-group">
                <label>目标客群对价格的敏感度</label>
                <select id="priceSensitivity">
                    <option value="">请选择...</option>
                    <option value="high">高度敏感（价格是主要购买因素）</option>
                    <option value="medium">中等敏感（价格重要但非唯一因素）</option>
                    <option value="low">低度敏感（质量/品牌更重要）</option>
                </select>
            </div>

            <div class="select-group">
                <label>产品/服务生命周期</label>
                <select id="lifecycle">
                    <option value="">请选择...</option>
                    <option value="launch">推出期（新产品）</option>
                    <option value="growth">成长期</option>
                    <option value="mature">成熟期</option>
                    <option value="decline">衰退期</option>
                </select>
            </div>

            <button class="button" onclick="recommendStrategy()">推荐策略</button>

            <div id="strategyResult" style="margin-top: 30px; display: none;">
                <div class="result-box">
                    <div class="result-item" style="border: none; padding: 0;">
                        <div class="result-label" style="margin-bottom: 15px;">推荐的定价策略</div>
                        <div id="strategyCards"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 3: 收益管理模拟器 -->
        <div class="tab-content">
            <h2 style="color: #667eea; margin-bottom: 20px;">Tab 3：收益管理模拟器</h2>

            <p class="info-text">模拟不同定价对航班/饭店总收入的影响（假设固定产能）。</p>

            <div class="input-group">
                <label>产能（座位/房间数）</label>
                <input type="number" id="capacity" value="150" step="1">
            </div>

            <div class="input-group">
                <label>商务客比例（%）</label>
                <input type="number" id="businessPercentage" value="20" min="0" max="100" step="1">
            </div>

            <div class="input-group">
                <label>商务客愿付价（元）</label>
                <input type="number" id="businessWTP" value="400" step="10">
            </div>

            <div class="input-group">
                <label>休闲客愿付价（元）</label>
                <input type="number" id="leisureWTP" value="200" step="10">
            </div>

            <div class="input-group">
                <label>定价策略</label>
                <select id="pricingModel" onchange="updatePricingInputs()">
                    <option value="uniform">统一定价</option>
                    <option value="tiered">分级定价</option>
                </select>
            </div>

            <div id="uniformPricingInputs" style="display: none;">
                <div class="input-group">
                    <label>统一价格（元）</label>
                    <input type="number" id="uniformPrice" value="300" step="10">
                </div>
            </div>

            <div id="tieredPricingInputs" style="display: none;">
                <div class="input-group">
                    <label>商务舱座位数</label>
                    <input type="number" id="businessSeats" value="30" step="1">
                </div>
                <div class="input-group">
                    <label>商务舱定价（元）</label>
                    <input type="number" id="businessPrice" value="350" step="10">
                </div>
                <div class="input-group">
                    <label>经济舱定价（元）</label>
                    <input type="number" id="economyPrice" value="180" step="10">
                </div>
            </div>

            <button class="button" onclick="simulateRevenue()">运行模拟</button>

            <div id="simulationResult" class="result-box" style="display: none; margin-top: 30px;">
                <div class="result-item">
                    <div class="result-label">每班次总收入</div>
                    <div class="result-value" id="totalRevenue">--</div>
                </div>
                <div class="result-item">
                    <div class="result-label">月度总收入（30班）</div>
                    <div class="result-value" id="monthlyRevenue">--</div>
                </div>
                <div class="result-item">
                    <div class="result-label">平均票价</div>
                    <div style="color: #333; font-weight: 600;" id="avgPrice">--</div>
                </div>
                <div class="result-item">
                    <div class="result-label">座位利用率</div>
                    <div style="color: #333; font-weight: 600;" id="occupancyRate">--</div>
                </div>
                <div class="result-item">
                    <div class="result-label">模拟详情</div>
                    <div style="color: #666; font-size: 13px; margin-top: 8px;" id="simulationDetails">--</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Tab 切换功能
        function switchTab(index) {
            const contents = document.querySelectorAll('.tab-content');
            const buttons = document.querySelectorAll('.tab-button');

            contents.forEach(content => content.classList.remove('active'));
            buttons.forEach(button => button.classList.remove('active'));

            contents[index].classList.add('active');
            buttons[index].classList.add('active');
        }

        // Tab 1: 计算弹性
        function calculateElasticity() {
            const pOrig = parseFloat(document.getElementById('priceOriginal').value);
            const pNew = parseFloat(document.getElementById('priceNew').value);
            const qOrig = parseFloat(document.getElementById('quantityOriginal').value);
            const qNew = parseFloat(document.getElementById('quantityNew').value);

            if (!pOrig || !pNew || !qOrig || !qNew) {
                alert('请输入所有数值');
                return;
            }

            const priceChange = (pNew - pOrig) / pOrig;
            const quantityChange = (qNew - qOrig) / qOrig;
            const ped = quantityChange / priceChange;

            const revenueOrig = pOrig * qOrig;
            const revenueNew = pNew * qNew;
            const revenueChange = revenueNew - revenueOrig;
            const revenueChangePercent = (revenueChange / revenueOrig * 100).toFixed(1);

            let explanation = '';
            let recommendation = '';

            if (Math.abs(ped) < 1) {
                explanation = `缺乏弹性（|PED| = ${Math.abs(ped).toFixed(2)} < 1）：需求对价格变化不敏感。`;
                recommendation = `消费者对价格变化反应迟钝。您可以进一步提价以增加收益，因为销量下降幅度小于价格提升幅度。`;
            } else if (Math.abs(ped) === 1) {
                explanation = `单位弹性（|PED| = 1）：需求与价格成比例变化。`;
                recommendation = `价格变化对收益影响有限。考虑提升产品差异化与品牌价值，降低价格敏感度。`;
            } else {
                explanation = `富有弹性（|PED| = ${Math.abs(ped).toFixed(2)} > 1）：需求对价格变化敏感。`;
                recommendation = `消费者对价格变化反应敏锐。降价能显著刺激销量增长。若要提价，需谨慎评估市场反应，或通过差异化产品抵消价格上升。`;
            }

            document.getElementById('pedValue').textContent = ped.toFixed(2);
            document.getElementById('pedExplain').textContent = explanation;
            document.getElementById('revenueOriginal').textContent = `${revenueOrig.toLocaleString('zh-TW')} 元`;
            document.getElementById('revenueNew').textContent = `${revenueNew.toLocaleString('zh-TW')} 元`;
            document.getElementById('revenueChange').textContent = `${revenueChange > 0 ? '+' : ''}${revenueChange.toLocaleString('zh-TW')} 元（${revenueChangePercent > 0 ? '+' : ''}${revenueChangePercent}%）`;
            document.getElementById('recommendation').textContent = recommendation;

            document.getElementById('elasticityResult').style.display = 'block';
        }

        // Tab 2: 推荐策略
        function updateStrategyOptions() {
            // 可扩展的策略推荐逻辑
        }

        function recommendStrategy() {
            const productType = document.getElementById('productType').value;
            const competition = document.getElementById('competition').value;
            const sensitivity = document.getElementById('priceSensitivity').value;
            const lifecycle = document.getElementById('lifecycle').value;

            if (!productType || !competition || !sensitivity || !lifecycle) {
                alert('请填写所有选项');
                return;
            }

            const strategies = getRecommendedStrategies(productType, competition, sensitivity, lifecycle);

            let html = '';
            strategies.forEach(strategy => {
                html += `
                    <div class="strategy-card">
                        <h4>${strategy.name}</h4>
                        <p>${strategy.description}</p>
                    </div>
                `;
            });

            document.getElementById('strategyCards').innerHTML = html;
            document.getElementById('strategyResult').style.display = 'block';
        }

        function getRecommendedStrategies(type, comp, sens, life) {
            const strategies = {
                software: [
                    { name: '分级订阅制', description: '提供基础版、专业版、企业版，针对不同用户群体实施差别定价。适合软件产品的持续营业收入模式。' },
                    { name: 'Freemium模式', description: '免费基础版 + 付费高级版。吸引大量用户，通过高级功能转换部分付费客户。' },
                    { name: '用量制定价', description: '根据使用量（API调用、存储容量）计费，灵活满足不同规模客户。' }
                ],
                luxury: [
                    { name: '价值基础定价', description: '根据品牌价值、设计、材质等因素定价，而非成本加成。追求利润最大化而非销量。' },
                    { name: '价格锚定', description: '通过展示高级产品线，提升整体品牌形象，为高价产品创造合理化。' },
                    { name: '限量策略', description: '限制产量与销售渠道，维持产品稀缺性与高价地位。' }
                ],
                commodity: [
                    { name: '成本领导 + 低价策略', description: '优化供应链与营运成本，通过天天低价（EDLP）赢得市场份额。' },
                    { name: '竞争导向定价', description: '密切追踪竞争对手价格，实施微幅价格调整以维持竞争力。' },
                    { name: '尾数定价', description: '将价格设为 .99 结尾，利用消费者心理偏差提升销量。' }
                ],
                service: [
                    { name: '收益管理 + 动态定价', description: '根据需求与库存实时调整价格。航空与饭店的标准做法。' },
                    { name: '分级与差别定价', description: '区分商务客 vs 休闲客，提供不同舱位/房型与价格。' },
                    { name: '提前预订折扣', description: '早订低价、临时高价，激励提前规划，优化座位/房间配置。' }
                ],
                subscription: [
                    { name: '分级订阅', description: '多个价格点（基础、标准、高级），满足不同用户需求。Netflix模式。' },
                    { name: '年度优惠', description: '年度支付享受折扣，提升客户粘性与预测性收入。' },
                    { name: '免费试用 + 升级促进', description: '免费试用期激励用户体验，通过功能限制促进付费升级。' }
                ]
            };

            return strategies[type] || [];
        }

        // Tab 3: 收益管理模拟
        function updatePricingInputs() {
            const model = document.getElementById('pricingModel').value;
            document.getElementById('uniformPricingInputs').style.display = model === 'uniform' ? 'block' : 'none';
            document.getElementById('tieredPricingInputs').style.display = model === 'tiered' ? 'block' : 'none';
        }

        function simulateRevenue() {
            const capacity = parseFloat(document.getElementById('capacity').value);
            const businessPct = parseFloat(document.getElementById('businessPercentage').value) / 100;
            const businessWTP = parseFloat(document.getElementById('businessWTP').value);
            const leisureWTP = parseFloat(document.getElementById('leisureWTP').value);
            const model = document.getElementById('pricingModel').value;

            if (!capacity || businessPct === undefined || !businessWTP || !leisureWTP) {
                alert('请输入所有数值');
                return;
            }

            let totalRevenue = 0;
            let occupancy = 0;
            let details = '';

            if (model === 'uniform') {
                const price = parseFloat(document.getElementById('uniformPrice').value);
                const businessCustomers = capacity * businessPct;
                const leisureCustomers = capacity * (1 - businessPct);

                totalRevenue = capacity * price;
                occupancy = 100;

                details = `统一价格 ${price} 元。商务客 ${Math.round(businessCustomers)} 人 × ${price} 元 = ${(businessCustomers * price).toLocaleString('zh-TW')} 元；休闲客 ${Math.round(leisureCustomers)} 人 × ${price} 元 = ${(leisureCustomers * price).toLocaleString('zh-TW')} 元。`;
            } else {
                const businessSeats = parseFloat(document.getElementById('businessSeats').value);
                const economySeats = capacity - businessSeats;
                const businessPrice = parseFloat(document.getElementById('businessPrice').value);
                const economyPrice = parseFloat(document.getElementById('economyPrice').value);

                const businessCustomers = Math.min(capacity * businessPct, businessSeats);
                const leisureCustomers = Math.min(capacity * (1 - businessPct), economySeats);

                totalRevenue = (businessCustomers * businessPrice) + (leisureCustomers * economyPrice);
                occupancy = ((businessCustomers + leisureCustomers) / capacity * 100);

                details = `商务舱 ${businessSeats} 座 @ ${businessPrice} 元，实际售出 ${Math.round(businessCustomers)} 张 = ${(businessCustomers * businessPrice).toLocaleString('zh-TW')} 元；经济舱 ${economySeats} 座 @ ${economyPrice} 元，实际售出 ${Math.round(leisureCustomers)} 张 = ${(leisureCustomers * economyPrice).toLocaleString('zh-TW')} 元。`;
            }

            const monthlyRevenue = totalRevenue * 30;
            const avgPrice = totalRevenue / (capacity * businessPct + capacity * (1 - businessPct));

            document.getElementById('totalRevenue').textContent = `${totalRevenue.toLocaleString('zh-TW')} 元`;
            document.getElementById('monthlyRevenue').textContent = `${monthlyRevenue.toLocaleString('zh-TW')} 元`;
            document.getElementById('avgPrice').textContent = `${avgPrice.toFixed(0)} 元`;
            document.getElementById('occupancyRate').textContent = `${occupancy.toFixed(1)}%`;
            document.getElementById('simulationDetails').textContent = details;

            document.getElementById('simulationResult').style.display = 'block';
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateStrategyOptions();
            updatePricingInputs();
        });
    </script>
</body>
</html>
